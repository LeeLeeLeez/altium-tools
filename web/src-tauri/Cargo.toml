[package]
name = "altium-tools"
version = "2.0.0"
description = "Altium 工具集 —— oink-ui 桌面版"
authors = ["altium-tools"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "altium_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
